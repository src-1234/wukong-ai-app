<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>悟空</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">

  <!-- ============ 首页 ============ -->
  <section class="page home active" id="home">
    <header class="topbar">
      <button class="iconbtn" id="btnNewTop" aria-label="新建对话">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4.1c-4.3 0-7.4 2.9-7.4 6.7 0 2.4 1.3 4.2 3 5.3v2.3h8.8v-2.3c1.7-1.1 3-2.9 3-5.3 0-3.8-3.1-6.7-7.4-6.7z"/>
          <path d="M12 7.3v5.2M9.4 9.9h5.2" stroke="#16C26B" stroke-width="1.8"/>
        </svg>
      </button>
      <button class="iconbtn" id="btnHistory" aria-label="对话历史">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </header>

    <div class="hero">
      <h1>悟空<span class="dot">，</span>AI 工作平台</h1>
    </div>

    <div class="composer-card" id="composerCard">
      <div class="attach-preview" id="attachPreview">
        <img id="attachThumb" alt="">
        <button class="attach-remove" id="attachRemove">×</button>
      </div>
      <textarea id="homeInput" rows="1" placeholder="需要悟空帮你干什么..."></textarea>
      <div class="composer-tools">
        <button class="round-mini" id="btnImage" aria-label="解读图片">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#2c3138" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="round-mini" id="btnModel" aria-label="切换模型">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#2c3138" stroke-width="1.9" stroke-linejoin="round"><path d="M13.5 3 6 13.2h4.6L9.6 21 17.5 10.6h-4.7z"/></svg>
        </button>
        <div class="composer-right">
          <button class="mode-pill" id="btnMode">标准<svg class="caret" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg></button>
          <button class="send-btn" id="btnSend" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.5 3.6 3.7 10.9l7.1 2.3 2.3 7.1z"/><path d="M20.5 3.6 10.8 13.2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="section-head">
      <span>精选案例</span>
      <button class="more" id="btnMore">查看更多
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="cases">
      <div class="case" data-case="设计">
        <div class="case-img"><img src="img/case_design.jpg" alt="设计"></div>
        <p>设计</p>
      </div>
      <div class="case" data-case="财务">
        <div class="case-img"><img src="img/case_finance.jpg" alt="财务"></div>
        <p>财务</p>
      </div>
    </div>

    <div class="home-tab">
      <img src="img/ic_wukong.png" alt="悟空">
      <span>悟空</span>
    </div>
  </section>

  <!-- ============ 对话页 ============ -->
  <section class="page chat" id="chat">
    <header class="chatbar">
      <button class="iconbtn back" id="btnBack" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="chat-title">
        <span class="t" id="chatTitle">新对话</span>
        <span class="s" id="chatSub">标准 · GPT-4o mini</span>
      </div>
      <button class="iconbtn" id="btnHistory2" aria-label="对话历史">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </header>
    <div class="msglist" id="msglist"></div>
    <div class="composer-bar">
      <div class="attach-preview bar" id="attachPreview2">
        <img id="attachThumb2" alt="">
        <button class="attach-remove" id="attachRemove2">×</button>
      </div>
      <div class="bar-row">
        <button class="round-mini" id="btnImage2" aria-label="解读图片">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#2c3138" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="chatInput" rows="1" placeholder="发消息给悟空..."></textarea>
        <button class="send-btn green" id="btnSend2" aria-label="发送">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.5 3.6 3.7 10.9l7.1 2.3 2.3 7.1z"/><path d="M20.5 3.6 10.8 13.2"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ 历史页 ============ -->
  <section class="page history" id="history">
    <header class="chatbar">
      <button class="iconbtn back" id="btnBack2" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="chat-title"><span class="t">对话历史</span></div>
      <button class="iconbtn" id="btnNew2" aria-label="新建对话">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="hist-body" id="histBody"></div>
    <div class="hist-foot">
      <div class="user-chip" id="userChip"></div>
    </div>
  </section>

</div>

<!-- ============ 遮罩与弹层 ============ -->
<div class="overlay" id="overlay"></div>

<div class="sheet" id="sheetMode">
  <div class="sheet-grab"></div>
  <h3>选择回答模式</h3>
  <div class="opt-card" data-mode="standard">
    <div class="opt-main"><b>标准</b><p>响应更快，适合日常问答、改写、翻译。</p></div>
    <i class="radio"></i>
  </div>
  <div class="opt-card" data-mode="advanced">
    <div class="opt-main"><b>高级</b><p>思考完整，推理较强，适合分析、方案、代码。</p></div>
    <i class="radio"></i>
  </div>
</div>

<div class="sheet" id="sheetModel">
  <div class="sheet-grab"></div>
  <h3>切换模型</h3>
  <div id="modelList" class="opt-list"></div>
  <div class="custom-model">
    <input id="customModel" placeholder="自定义模型 ID，如 openai/gpt-4o">
    <button id="btnCustomModel">使用</button>
  </div>
  <p class="sheet-tip">免密钥通道匿名开放 GPT-OSS 20B，无需填写任何 Token 或 API Key。</p>
</div>

<div class="sheet login-sheet" id="sheetLogin">
  <div class="sheet-grab"></div>
  <h3>登录后查看对话历史</h3>
  <p class="sheet-tip">悟空会同步你的历史会话，方便随时找回。</p>
  <div class="login-tabs">
    <button class="tab active" data-tab="email">邮箱登录</button>
    <button class="tab" data-tab="phone">手机号</button>
    <button class="tab" data-tab="qr">钉钉扫码</button>
  </div>

  <div class="login-pane" id="paneEmail">
    <input id="loginEmail" type="email" placeholder="请输入邮箱地址">
    <button class="primary-btn full" id="btnEmailLogin">登录</button>
  </div>

  <div class="login-pane hidden" id="panePhone">
    <div class="phone-row">
      <span class="cc">+86</span>
      <input id="loginPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号">
    </div>
    <div class="phone-row">
      <input id="loginCode" type="tel" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
      <button class="code-btn" id="btnSendCode">获取验证码</button>
    </div>
    <button class="primary-btn full" id="btnPhoneLogin">登录</button>
  </div>

  <div class="login-pane hidden" id="paneQr">
    <div class="qr-wrap">
      <img id="qrImg" alt="登录二维码">
      <div class="qr-mask" id="qrMask"><span>二维码已过期</span><button id="btnQrRefresh">刷新</button></div>
    </div>
    <p class="qr-status" id="qrStatus">打开钉钉 App 扫一扫，在手机上确认登录</p>
    <button class="ghost-btn full" id="btnQrSim">模拟扫码成功（演示）</button>
  </div>

  <p class="login-legal">登录即表示同意《悟空服务协议》和《隐私政策》</p>
</div>

<script src="app.js"></script>
</body>
</html>
